asyncapi: 3.0.0
info:
  title: Circular
  version: 1.0.0
channels:
  entities:
    address: entities
    messages:
      entityCreated:
        payload:
          $ref: '#/components/schemas/entity'
components:
  schemas:
    filters:
      type: array
      items:
        anyOf:
          - $ref: '#/components/schemas/filters'
          - type: string
    entity:
      type: object
      properties:
        filters:
          $ref: '#/components/schemas/filters'
